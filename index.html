<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>قرآن کریم | تلاوت و ترجمه</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div>
        <h1>📖 قرآن کریم</h1>
        <p>تلاوت، ترجمه و جستجوی آیات</p>
    </div>

    <button id="darkModeBtn" class="icon-btn">🌙</button>
</header>

<main class="container">

    <section class="controls">

        <div class="control">
            <label for="surahSelect">سوره</label>
            <select id="surahSelect">
                <option value="">در حال دریافت سوره‌ها...</option>
            </select>
        </div>

        <div class="control">
            <label for="reciterSelect">قاری</label>
            <select id="reciterSelect">

                <option value="ar.alafasy">
                    مشاری راشد العفاسی
                </option>

                <option value="ar.abdulbasitmurattal">
                    عبدالباسط عبدالصمد
                </option>

                <option value="ar.husary">
                    محمود خلیل الحصری
                </option>

                <option value="ar.minshawi">
                    محمد صدیق المنشاوی
                </option>

                <option value="ar.muhammadayyoub">
                    محمد ایوب
                </option>

                <option value="ar.mahermuaiqly">
                    ماهر المعيقلي
                </option>

                <option value="ar.saadsheqam">
                    سعد الغامدی
                </option>

                <option value="ar.abdurrahmaansudais">
                    عبدالرحمن السدیس
                </option>

                <option value="ar.yasserdossary">
                    یاسر الدوسری
                </option>

            </select>
        </div>

        <div class="control">
            <label for="translationSelect">ترجمه</label>

            <select id="translationSelect">

                <option value="fa.makarem">
                    مکارم شیرازی
                </option>

                <option value="fa.fooladvand">
                    فولادوند
                </option>

                <option value="fa.ansarian">
                    انصاریان
                </option>

                <option value="fa.ayati">
                    آیتی
                </option>

            </select>
        </div>

    </section>


    <section class="search-box">

        <input
            id="searchInput"
            type="search"
            placeholder="جستجو در متن آیات..."
        >

        <button id="searchBtn">
            🔎 جستجو
        </button>

    </section>


    <section class="player">

        <div class="player-info">
            <strong id="playerTitle">
                آماده پخش
            </strong>

            <span id="playerStatus">
                یک سوره را انتخاب کنید
            </span>
        </div>

        <audio id="audioPlayer" controls preload="none"></audio>

        <div class="player-buttons">

            <button id="prevBtn">
                ⏮ آیه قبل
            </button>

            <button id="playSurahBtn" class="main-btn">
                ▶ پخش کل سوره
            </button>

            <button id="nextBtn">
                آیه بعد ⏭
            </button>

        </div>

        <button id="stopBtn" class="stop-btn">
            ⏹ توقف
        </button>

    </section>


    <section class="surah-header">

        <h2 id="surahName">
            قرآن کریم
        </h2>

        <p id="surahInfo">
            سوره‌ای را انتخاب کنید
        </p>

    </section>


    <section id="ayahContainer" class="ayah-container">

        <div class="loading">
            برای شروع، یک سوره را انتخاب کنید.
        </div>

    </section>

</main>


<footer>

    <p>
        قرآن کریم | طراحی شده برای مطالعه و تلاوت
    </p>

    <p class="small">
        اطلاعات قرآن از سرویس عمومی Al Quran Cloud دریافت می‌شود.
    </p>

</footer>


<script src="script.js"></script>

</body>
</html>
